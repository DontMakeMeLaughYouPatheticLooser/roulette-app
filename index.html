<style>

.col1{flex-direction:column;align-items:stretch}.col1 .btn{text-align:center}

@media(max-aspect-ratio:1/1){body::before{background:linear-gradient(rgba(255,245,232,.42),rgba(255,245,232,.42)),url(bg-mobile.jpg) center/cover}}

.bar{display:flex;gap:10px;margin:0 0 16px}.bar input{flex:1}.bar select{width:auto}

.meta{margin:6px 0}.meta a.ad{display:block;font-size:.85rem;color:var(--ac);margin-top:4px;word-break:break-word}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.75rem;background:#FFE7B8;color:#7A4B00}.pill.x{background:#E8E2DB;color:var(--mu)}.pill.s{background:#FAD4D4;color:#8A1F1F}
#ed,#dn{max-width:520px;width:94%;max-height:92vh;overflow:auto;padding:20px;border:1px solid var(--ln);border-radius:14px}#ed .f,#dn .f{margin-bottom:10px}
.st button:disabled{cursor:default}.rr{display:flex;align-items:center;gap:8px;font-size:.82rem}.rr .rn{min-width:84px;color:var(--mu)}
.pill.l{background:#FAD4E4;color:#8A1F55}.sm.on{background:#FAD4E4;border-color:#E9A9C6}.mem{margin:6px 0;font-size:.88rem}.mem .dt{color:var(--mu);font-size:.8rem}
#flt{position:relative;max-width:720px;margin:0 auto;padding-left:30px;border-left:3px solid #E0B9A0}
.tm{font-family:Georgia,serif;font-size:1.1rem;margin:22px 0 10px;text-transform:capitalize;text-shadow:0 0 8px #FFF5E8}
.te{position:relative;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;margin:0 0 14px}
.te::before{content:"";position:absolute;left:-41px;top:16px;width:14px;height:14px;border-radius:50%;background:var(--pc,var(--ac));border:3px solid var(--bg)}
.te h4{font-size:1rem}.te .d2{color:var(--mu);font-size:.8rem;margin:2px 0 6px}
</style></head><body>
<div id="app" hidden>
<header><h1>Boîte à idées</h1>
<nav role="tablist"><button role="tab" id="t1" aria-selected="true">Proposer une idée</button><button role="tab" id="t2" aria-selected="false">Tableau de bord</button><button role="tab" id="t3" aria-selected="false">La frise</button></nav>
<div class="r"><span id="st"></span><button class="btn s" id="cfg">Réglages</button></div></header>
<main>
<section id="add"><h2>Proposer une idée</h2>
<div class="chips" id="cats" role="group" aria-label="Catégorie"></div><div class="chips" id="subs" role="group" aria-label="Sous-catégorie" hidden></div>
<form class="ticket" id="tk" hidden><div class="th" id="tl"></div><div class="tb">
<label class="f">Titre<input type="text" name="ttl" required maxlength="120"></label>
<label class="f">Description<textarea name="dsc" maxlength="1000"></textarea></label>
<div id="tgw"></div><label class="f">Adresse (optionnel)<input type="text" name="adr" maxlength="200"></label><label class="f">Date limite (optionnel)<input type="date" name="fin"></label><label class="f">Photos ou GIF (3 maximum, GIF 2 Mo max)<input type="file" id="fi" accept="image/*" multiple></label><div class="pv" id="pv"></div><div><button class="btn" type="submit">Ajouter le ticket</button></div></div></form></section>
<section id="fr" hidden><h2>La frise</h2><div id="flt"></div></section><section id="board" hidden><h2>Tableau de bord</h2>
<div class="rl"><h3>Tirage au sort</h3><label class="pk"><input type="checkbox" id="all"> <b id="alll">Tout sélectionner</b></label><div class="pks" id="picks"></div>
<div class="ac"><button class="btn" id="draw">Tirer un ticket au hasard</button><span class="mu" id="avail"></span></div><div id="res" hidden aria-live="polite"></div></div>
<div class="bar"><input type="search" id="q" placeholder="Rechercher (titre, description, étiquettes)" aria-label="Rechercher"><select id="so" aria-label="Trier"><option value="new">Plus récents</option><option value="old">Plus anciens</option><option value="auth">Par auteur</option><option value="note">Mieux notés</option><option value="end">Date limite</option><option value="like">Envies communes</option></select></div><div class="cols" id="cols"></div><div class="sep"></div><section class="col fait" id="done"></section></section>
</main></div>
<section id="setup" hidden><h2>Configuration</h2>
<form class="ticket" id="sf"><div class="th">Connexion au stockage partagé</div><div class="tb">
<div class="adv tb" style="padding:0"><label class="f">Lien de configuration (si on t'en a envoyé un)<input type="text" name="l"></label>
<label class="f">Compte GitHub propriétaire<input type="text" name="o"></label>
<label class="f">Dépôt de données<input type="text" name="r"></label>
<label class="f">Jeton d'accès<input type="password" name="t" autocomplete="off"></label></div>
<label class="f">Ton prénom (affiché sur tes tickets)<input type="text" name="n" required maxlength="30"></label>
<p id="msg"></p><div><button class="btn" type="submit">Se connecter</button></div></div></form></section>
<datalist id="tgl"></datalist><dialog id="dn"></dialog><dialog id="ed"></dialog><dialog id="lb"><img alt=""></dialog><canvas id="fx"></canvas><dialog id="dlg"></dialog><div id="toast" hidden></div>
<script>
const $=s=>document.querySelector(s);
const h=(t,a={},...c)=>{const e=document.createElement(t);for(const[k,v]of Object.entries(a)){if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v===true)e.setAttribute(k,'');else if(v!==false&&v!=null)e.setAttribute(k,v)}for(const x of c.flat())if(x)e.append(x.nodeType?x:document.createTextNode(x));return e};
const CATS=[{id:'culture',l:'Activité culturelle',s:[['cinema','Cinéma'],['expo','Exposition'],['concert','Concert'],['sortie','Sortie / balade']]},{id:'sport',l:'Activité sportive'},{id:'film',l:'Films / séries'},{id:'resto',l:'Restaurant',s:[['restaurant','Restaurant'],['fastfood','Fast-food']]},{id:'autre',l:'Autre idée'}];
const COLS=CATS.flatMap(c=>c.s?c.s.map(([k,l])=>({k,l})):[{k:c.id,l:c.l}]);
const LS='programme-a-deux.v1',FILE='tickets.json';
let S=JSON.parse(localStorage.getItem(LS)||'{}');S.tickets=S.tickets||[];S.people=S.people||{};
const save=()=>localStorage.setItem(LS,JSON.stringify(S));
const enc=s=>btoa(unescape(encodeURIComponent(s))),dec=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
const setStatus=(m,e)=>{const s=$('#st');s.textContent=m;s.className=e?'err':''};
let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2500)};
const hd=(o={})=>({Accept:'application/vnd.github+json',Authorization:'Bearer '+S.cfg.t,...o});
const api=(p,o={})=>fetch(`https://api.github.com/repos/${encodeURIComponent(S.cfg.o)}/${encodeURIComponent(S.cfg.r)}${p?'/'+p:''}`,{cache:'no-store',...o,headers:hd(o.headers)});
async function pull(){const r=await api('contents/'+FILE);if(r.status===404)return{tickets:[],people:{},sha:null};if(!r.ok)throw new Error(r.status===401||r.status===403?'Accès refusé : vérifie le jeton (permission Contents en lecture/écriture).':'Erreur GitHub '+r.status);const j=await r.json(),d=JSON.parse(dec(j.content));return{tickets:d.tickets||[],people:d.people||{},sha:j.sha}}
const mm=(a={},b={})=>{const m={...a};for(const[k,v]of Object.entries(b))if(!m[k]||(v.at||0)>(m[k].at||0))m[k]=v;return m};
const merge=(a,b)=>{const m=new Map();for(const t of[...a,...b]){const x=m.get(t.id);if(!x){m.set(t.id,t);continue}const r={...((t.updated||0)>(x.updated||0)?t:x)},ra=mm(x.ratings,t.ratings),li=mm(x.likes,t.likes);if(Object.keys(ra).length)r.ratings=ra;if(Object.keys(li).length)r.likes=li;m.set(t.id,r)}return[...m.values()]};
const canon=v=>Array.isArray(v)?v.map(canon):v&&typeof v==='object'?Object.fromEntries(Object.keys(v).sort().map(k=>[k,canon(v[k])])):v;
const SW=['#B83A4B','#E0742F','#C79A1B','#5E8C3A','#2F8F83','#3B73B9','#7A52B3','#A44A8A','#2E1B5E','#D1122B'];
const okc=c=>/^#[0-9a-f]{6}$/i.test(c)?c:null,pc=n=>okc((S.people[n]||{}).color)||'#B8A99A';
const mergeP=(a,b)=>{const m={...a};for(const[k,v]of Object.entries(b))if(!m[k]||(v.updated||0)>(m[k].updated||0))m[k]=v;return m};
const autoColor=()=>{if(!S.people[S.cfg.name]){const u=Object.values(S.people).map(p=>p.color);S.people[S.cfg.name]={color:SW.find(c=>!u.includes(c))||SW[0],updated:Date.now()}}};
const ser=(x,p)=>JSON.stringify(canon([x.slice().sort((a,b)=>a.id<b.id?-1:1),Object.entries(p).sort()]));
let busy=false,again=false;
async function sync(){if(busy){again=true;return}busy=true;setStatus('Synchronisation…');
try{for(let i=0;i<3;i++){const rm=await pull();S.tickets=merge(S.tickets,rm.tickets);S.people=mergeP(S.people,rm.people);autoColor();
if(ser(S.tickets,S.people)!==ser(rm.tickets,rm.people)){const r=await api('contents/'+FILE,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'Mise à jour des tickets',content:enc(JSON.stringify({tickets:S.tickets,people:S.people},null,1)),...(rm.sha?{sha:rm.sha}:{})})});
if(r.status===409||r.status===422)continue;if(!r.ok)throw new Error('Écriture refusée ('+r.status+') : le jeton doit avoir « Contents : Read and write ».')}break}
save();render();setStatus('Synchronisé')}catch(e){setStatus(navigator.onLine?e.message:'Hors connexion : modifications conservées',true)}
busy=false;if(again){again=false;sync()}}
const upd=(id,p)=>{const t=S.tickets.find(x=>x.id===id);if(t.done&&!ymdOk(t.doneAt)&&!('doneAt' in p))p={...p,doneAt:dOf(t)};Object.assign(t,p,{updated:Date.now()});save();render();sync()};
const linkify=s=>{const o=[];let i=0;for(const m of s.matchAll(/(?:https?:\/\/|www\.)[^\s<>"']+/g)){if(m.index>i)o.push(s.slice(i,m.index));let u=m[0],tl='';while(/[.,;:!?)\]]$/.test(u)){tl=u.slice(-1)+tl;u=u.slice(0,-1)}o.push(h('a',{href:u.startsWith('www.')?'https://'+u:u,target:'_blank',rel:'noopener noreferrer'},u));if(tl)o.push(tl);i=m.index+m[0].length}if(i<s.length)o.push(s.slice(i));return o};
let files=[];const b64=b=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result.split(',')[1]);x.readAsDataURL(b)});
const drawPv=()=>$('#pv').replaceChildren(...files.map((x,i)=>h('span',{class:'pvi'},h('img',{src:x.url,alt:''}),h('button',{type:'button','aria-label':'Retirer',onclick:()=>{files.splice(i,1);drawPv()}},'×'))));
const resetForm=()=>{$('#tk').reset();ctb.reset();files=[];drawPv()};
async function shrink(f){if(f.type==='image/gif'){if(f.size>2097152)throw new Error('GIF trop lourd (2 Mo max) : réduis-le sur ezgif.com');return{blob:f,ext:'gif'}}
const bm=await createImageBitmap(f),k=Math.min(1,1280/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
return{blob:await new Promise(r=>c.toBlob(r,'image/jpeg',.8)),ext:'jpg'}}
$('#fi').onchange=async e=>{for(const f of e.target.files){if(files.length>=3){toast('3 images maximum par ticket');break}try{const x=await shrink(f);files.push({...x,url:URL.createObjectURL(x.blob)})}catch(err){toast(err.message||'Image illisible')}}e.target.value='';drawPv()};
const imgC={};
async function mediaURL(m){const k=m.id+'.'+m.ext;if(imgC[k])return imgC[k];let ca,rq=new Request('https://media.local/'+k),r;try{ca=await caches.open('media-v1');r=await ca.match(rq)}catch{}
if(!r){const x=await api('contents/media/'+k,{headers:{Accept:'application/vnd.github.raw+json'}});if(!x.ok)throw 0;r=new Response(new Blob([await x.arrayBuffer()],{type:m.ext==='gif'?'image/gif':'image/jpeg'}));try{await ca.put(rq,r.clone())}catch{}}
return imgC[k]=URL.createObjectURL(await r.blob())}
const okm=m=>m&&/^[0-9a-f-]{36}$/.test(m.id)&&/^(jpg|gif)$/.test(m.ext);
const mediaEl=t=>{const l=(t.media||[]).filter(okm);return l.length?h('div',{class:'med'},l.map(m=>{const i=h('img',{alt:'Image jointe'});mediaURL(m).then(u=>i.src=u).catch(()=>i.alt='Image indisponible');i.onclick=()=>mediaURL(m).then(u=>{$('#lb img').src=u;$('#lb').showModal()});return i})):null};
