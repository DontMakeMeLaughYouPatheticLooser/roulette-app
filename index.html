<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boîte à idées</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#B83A4B"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Boîte à idées"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--bg:#FFF5E8;--sf:#fffdfa;--ink:#3A2420;--mu:#7C6258;--ln:#EBD6C0;--ac:#B83A4B;--ac2:#FCE4CF;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}

button{font:inherit;cursor:pointer}:focus-visible{outline:2px solid #4A7BD0;outline-offset:2px}
[hidden]{display:none!important}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 28px;padding:12px 24px;background:linear-gradient(110deg,#B83A4B,#E0742F);color:#fff}

.btn{background:var(--ac);color:#fff;border:1px solid var(--ac);padding:9px 18px;border-radius:999px;display:inline-block}
.btn.s{background:var(--sf);color:var(--ac);border-color:var(--ln)}
header .btn.s{background:none;color:#fff;border-color:#F5B79C;padding:5px 10px}
main,#setup{max-width:1400px;margin:0 auto;padding:24px}
h2{font-size:1.5rem;margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{background:var(--sf);border:1px solid var(--ln);padding:8px 14px;border-radius:999px}
.chip[aria-pressed=true]{background:var(--ac);color:#fff;border-color:var(--ac)}
.ticket{position:relative;background:var(--sf);border:1px solid var(--ln);border-radius:14px;width:100%;max-width:560px;margin:8px auto 0}
.ticket::before,.ticket::after{content:"";position:absolute;top:47px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:1px solid var(--ln)}
.ticket::before{left:-10px}.ticket::after{right:-10px}
.th{height:56px;display:flex;align-items:center;padding:0 26px;border-bottom:2px dashed var(--ln);font-family:Georgia,serif;font-weight:600;background:var(--pc,var(--ac));color:#fff;border-radius:13px 13px 0 0}
.tb{padding:20px 26px;display:grid;gap:14px}

input[type=text],input[type=password],textarea{font:inherit;color:var(--ink);padding:9px 10px;border:1px solid var(--ln);border-radius:4px;width:100%}

.rl{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:16px 20px;margin-bottom:20px}

.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px;margin-top:8px}
.card h4{font-size:1rem}.card.done{background:#FBF1E4;color:var(--mu)}
.d{margin:6px 0;white-space:pre-wrap;font-size:.92rem}.mu{color:var(--mu)}.m{font-size:.8rem;margin:4px 0}
.sm{font-size:.78rem;padding:4px 9px;border:1px solid var(--ln);background:#fff;border-radius:3px;color:var(--ink)}
.st button{background:none;border:0;font-size:1.15rem;color:#E2CFBC;padding:0 1px}.st button.on{color:#B7791F}

.col1{flex-direction:column;align-items:stretch}.col1 .btn{text-align:center}

.pre .adv{display:none}#msg{color:#A33A3A;margin:0}

#add{max-width:620px;margin:0 auto;text-align:center}#add .chips{justify-content:center}.ticket{text-align:left}
#res{text-align:center}#res .ac{justify-content:center}
.wh{position:relative;width:min(290px,80vw);margin:8px auto}.wh svg{width:100%;display:block;transition:transform 4.2s cubic-bezier(.12,.7,.1,1)}

.who::before{content:"";display:inline-block;width:.65em;height:.65em;border-radius:50%;background:var(--pc);margin-right:6px}

</style></head><body>
<div id="app" hidden>
<header><h1>Boîte à idées</h1>
<nav role="tablist"><button role="tab" id="t1" aria-selected="true">Proposer une idée</button><button role="tab" id="t2" aria-selected="false">Tableau de bord</button></nav>
<div class="r"><span id="st"></span><button class="btn s" id="cfg">Réglages</button></div></header>
<main>
<section id="add"><h2>Proposer une idée</h2>
<div class="chips" id="cats" role="group" aria-label="Catégorie"></div><div class="chips" id="subs" role="group" aria-label="Sous-catégorie" hidden></div>
<form class="ticket" id="tk" hidden><div class="th" id="tl"></div><div class="tb">
<label class="f">Titre<input type="text" name="ttl" required maxlength="120"></label>
<label class="f">Description<textarea name="dsc" maxlength="1000"></textarea></label>
<label class="f">Photos ou GIF (3 maximum, GIF 2 Mo max)<input type="file" id="fi" accept="image/*" multiple></label><div class="pv" id="pv"></div><div><button class="btn" type="submit">Ajouter le ticket</button></div></div></form></section>
<section id="board" hidden><h2>Tableau de bord</h2>
<div class="rl"><h3>Tirage au sort</h3><div class="pks" id="picks"></div>
<div class="ac"><button class="btn" id="draw">Tirer un ticket au hasard</button><span class="mu" id="avail"></span></div><div id="res" hidden aria-live="polite"></div></div>
<div class="cols" id="cols"></div></section>
</main></div>
<section id="setup" hidden><h2>Configuration</h2>
<form class="ticket" id="sf"><div class="th">Connexion au stockage partagé</div><div class="tb">
<div class="adv tb" style="padding:0"><label class="f">Lien de configuration (si on t'en a envoyé un)<input type="text" name="l"></label>
<label class="f">Compte GitHub propriétaire<input type="text" name="o"></label>
<label class="f">Dépôt de données<input type="text" name="r"></label>
<label class="f">Jeton d'accès<input type="password" name="t" autocomplete="off"></label></div>
<label class="f">Ton prénom (affiché sur tes tickets)<input type="text" name="n" required maxlength="30"></label>
<p id="msg"></p><div><button class="btn" type="submit">Se connecter</button></div></div></form></section>
<dialog id="lb"><img alt=""></dialog><canvas id="fx"></canvas><dialog id="dlg"></dialog><div id="toast" hidden></div>
<script>

const imgC={};

const mediaEl=t=>{const l=(t.media||[]).filter(okm);return l.length?h('div',{class:'med'},l.map(m=>{const i=h('img',{alt:'Image jointe'});mediaURL(m).then(u=>i.src=u).catch(()=>i.alt='Image indisponible');i.onclick=()=>mediaURL(m).then(u=>{$('#lb img').src=u;$('#lb').showModal()});return i})):null};
$('#lb').onclick=()=>$('#lb').close();
const av=n=>{const a=(S.people[n]||{}).avatar;return a&&/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(a)?h('img',{class:'av',src:a,alt:''}):null};
async function setAvatar(e){try{const bm=await createImageBitmap(e.target.files[0]),z=Math.min(bm.width,bm.height),c=document.createElement('canvas');c.width=c.height=128;c.getContext('2d').drawImage(bm,(bm.width-z)/2,(bm.height-z)/2,z,z,0,0,128,128);S.people[S.cfg.name]={...S.people[S.cfg.name],avatar:c.toDataURL('image/jpeg',.8),updated:Date.now()};save();render();sync();$('#avp').replaceChildren(av(S.cfg.name))}catch{toast('Image illisible')}}

const mk=cl=>{const c=fm.cloneNode(true);c.querySelectorAll('[id]').forEach(n=>n.removeAttribute('id'));c.removeAttribute('id');c.querySelector('[name=ttl]').setAttribute('value',fm.ttl.value);c.querySelector('textarea').textContent=fm.dsc.value;Object.assign(c.style,{position:'fixed',left:r.left+'px',top:r.top+'px',width:r.width+'px',margin:0,zIndex:60,clipPath:cl,pointerEvents:'none',transformOrigin:'0 '+cut+'px'});document.body.append(c);return c};

let pick={cat:null,col:null};

try{const media=[];for(const x of files){const id=crypto.randomUUID(),r=await api('contents/media/'+id+'.'+x.ext,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'Ajout image',content:await b64(x.blob)})});if(!r.ok)throw 0;media.push({id,ext:x.ext})}

function count(){const n=pool().length;$('#avail').textContent=n+' ticket'+(n>1?'s':'')+' disponible'+(n>1?'s':'');$('#draw').disabled=!n}
function render(){if(!S.cfg)return;S.sel=S.sel||COLS.map(c=>c.k);const live=S.tickets.filter(t=>!t.deleted);

let spin=false;const WP=['#B83A4B','#E0742F','#C79A1B','#5E8C3A','#2F8F83','#3B73B9'];
